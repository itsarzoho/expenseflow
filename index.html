<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExpenseCloud</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css">
<style>*{font-family:'Inter',sans-serif} dialog::backdrop{background:rgba(0,0,0,0.5)} dialog{border:0;border-radius:20px}</style>
</head>
<body class="bg-gray-50 min-h-screen">

<header class="bg-gradient-to-r from-violet-600 via-indigo-600 to-blue-600 border-b sticky top-0 z-20 shadow-lg">
<div class="max-w-[1400px] mx-auto px-4 h-16 flex items-center justify-between">
<div class="flex items-center gap-3"><div class="w-10 h-10 bg-white text-violet-600 rounded-xl flex items-center justify-center shadow-md"><i class="ri-wallet-3-fill text-xl"></i></div><h1 class="font-black text-white">ExpenseCloud</h1></div>
<div class="flex gap-2 items-center">
<span id="userEmail" class="hidden text-xs font-bold"></span>
<button onclick="openAuthModal('login')" id="loginBtn" class="bg-white text-violet-600 px-5 py-2 rounded-full text-xs font-bold shadow-md">Login</button>
<button onclick="handleLogout()" id="logoutBtn" class="hidden border-2 px-4 py-2 rounded-full text-xs font-bold">Logout</button>
<button onclick="openAddModal()" class="bg-gradient-to-r from-orange-400 to-pink-500 text-white px-5 py-2.5 rounded-full text-xs font-black flex items-center gap-1 shadow-lg"><i class="ri-add-line"></i> Add</button>
</div>
</div>
</header>

<main class="max-w-[1400px] mx-auto p-4">

<!-- STATS -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
<div class="col-span-2 bg-gradient-to-br from-violet-600 via-indigo-600 to-blue-500 text-white rounded-2xl p-6 shadow-xl"><p class="text-[10px] tracking-widest text-violet-200">WALLET BALANCE</p><h2 id="walletBalance" class="text-3xl font-black mt-2">₹0</h2><p class="text-xs text-gray-400 mt-1"><span id="incomeTotal">Income ₹0</span> • <span id="expenseTotal">Expense ₹0</span></p></div>
<div class="bg-gradient-to-br from-orange-50 to-pink-50 rounded-2xl border border-orange-200 p-5"><p class="text-[10px] font-bold text-orange-600">TOTAL SPENT</p><h3 id="totalSpent" class="text-2xl font-black mt-2">₹0</h3><p class="text-xs text-gray-500"><span id="totalEntries">0</span> entries</p></div>
<div class="bg-gradient-to-br from-green-50 to-emerald-50 rounded-2xl border border-green-200 p-5"><p class="text-[10px] font-bold text-green-600">THIS MONTH</p><h3 id="thisMonthSpent" class="text-2xl font-black mt-2">₹0</h3><p class="text-xs text-gray-500" id="thisMonthLabel">Sep 2026</p></div>
</div>

<!-- CHARTS - BIGGER -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">

<div class="bg-white rounded-2xl border p-5 shadow-sm">
<h4 class="font-black text-sm flex items-center gap-2"><i class="ri-pie-chart-2-fill text-blue-600"></i> Category Wise</h4>
<div style="height:260px" class="mt-4"><canvas id="donutChart"></canvas></div>
<div id="donutList" class="mt-3 text-xs space-y-1"></div>

</div>

<div class="bg-white rounded-2xl border p-5 shadow-sm">
<h4 class="font-black text-sm flex items-center gap-2"><i class="ri-bar-chart-fill text-green-600"></i> Monthly Trend</h4>
<div style="height:260px" class="mt-4"><canvas id="barChart"></canvas></div>

</div>

<div class="bg-white rounded-2xl border p-5 shadow-sm">
<h4 class="font-black text-sm flex items-center gap-2"><i class="ri-donut-chart-fill text-purple-600"></i> Payment Type</h4>
<div style="height:260px" class="mt-4"><canvas id="pieChart"></canvas></div>

<div id="pieList" class="mt-3 text-xs"></div>
</div>

<div class="bg-white rounded-2xl border p-5 shadow-sm">
<h4 class="font-black text-sm flex items-center gap-2"><i class="ri-line-chart-fill text-orange-600"></i> Daily Trend</h4>
<div style="height:260px" class="mt-4"><canvas id="lineChart"></canvas></div>

</div>

</div>

<!-- TABLE -->
<div class="bg-white rounded-2xl border overflow-hidden">
<div class="p-5 flex justify-between"><h4 class="font-black text-sm">Transactions <span id="tableCount" class="bg-gradient-to-r from-violet-600 to-indigo-600 text-white text-[10px] px-2 py-1 rounded-full">0</span></h4><button onclick="exportCSV()" class="border px-3 py-1 rounded-full text-xs font-bold">Export CSV</button></div>
<div class="overflow-auto"><table class="w-full text-xs"><thead class="bg-gray-50"><tr><th class="p-3 text-left">DATE</th><th class="p-3 text-left">TYPE</th><th class="p-3 text-left">AMOUNT</th><th class="p-3 text-left">CATEGORY</th><th class="p-3 text-left">DETAILS</th><th class="p-3 text-left">ACTION</th></tr></thead><tbody id="tbody"></tbody></table></div>
</div>

</main>

<footer class="text-center py-6 text-xs text-gray-500">Developed by : arzoho@proton.me</footer>

<!-- AUTH MODAL -->
<dialog id="authModal" class="p-0 w-full max-w-[400px] m-auto">
<div class="bg-white p-6 rounded-2xl">
<div class="flex justify-between mb-4"><h3 class="font-black text-lg">Welcome</h3><button onclick="document.getElementById('authModal').close()" class="w-8 h-8 bg-gray-100 rounded-full">✕</button></div>
<div class="flex gap-2 mb-4 p-1 bg-gray-100 rounded-full">
<button id="tabLogin" onclick="switchTab('login')" class="flex-1 py-2 rounded-full text-xs font-black bg-black text-white">Login</button>
<button id="tabSignup" onclick="switchTab('signup')" class="flex-1 py-2 rounded-full text-xs font-black">Sign Up</button>
<button id="tabForgot" onclick="switchTab('forgot')" class="flex-1 py-2 rounded-full text-xs font-black">Forgot?</button>
</div>

<div id="loginDiv">
<input id="loginEmail" type="email" placeholder="Email" class="w-full border-2 rounded-full px-4 py-3 text-sm mb-2">
<input id="loginPassword" type="password" placeholder="Password" class="w-full border-2 rounded-full px-4 py-3 text-sm mb-3">
<button onclick="handleLogin()" class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 text-white py-3 rounded-full text-sm font-black shadow-lg">Login</button>
</div>

<div id="signupDiv" class="hidden">
<input id="signupEmail" type="email" placeholder="Email" class="w-full border-2 rounded-full px-4 py-3 text-sm mb-2">
<input id="signupPassword" type="password" placeholder="Password (min 6)" class="w-full border-2 rounded-full px-4 py-3 text-sm mb-2">
<input id="signupConfirm" type="password" placeholder="Confirm" class="w-full border-2 rounded-full px-4 py-3 text-sm mb-3">
<button onclick="handleSignup()" class="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white py-3 rounded-full text-sm font-black shadow-lg">Create Account</button>
</div>

<div id="forgotDiv" class="hidden">
<input id="forgotEmail" type="email" placeholder="Your email" class="w-full border-2 rounded-full px-4 py-3 text-sm mb-3">
<button onclick="handleForgot()" class="w-full bg-gradient-to-r from-orange-400 to-pink-500 text-white py-3 rounded-full text-sm font-black shadow-lg">Send Reset Link</button>
</div>

<div class="mt-4 text-center"><div class="flex items-center gap-2 my-3"><div class="flex-1 h-px bg-gray-200"></div><span class="text-xs text-gray-400">OR</span><div class="flex-1 h-px bg-gray-200"></div></div>
<button onclick="handleGoogle()" class="w-full border-2 py-3 rounded-full text-sm font-bold flex items-center justify-center gap-2"><img src="https://www.google.com/favicon.ico" class="w-4 h-4"> Continue with Gmail</button></div>

<p id="authMsg" class="text-xs text-center mt-3 font-bold min-h-[20px]"></p>
</div>
</dialog>

<!-- ADD MODAL -->
<dialog id="addModal" class="p-0 w-full max-w-[450px] m-auto">
<div class="bg-white p-6 rounded-2xl">
<div class="flex justify-between mb-4"><h3 class="font-black">Add Transaction</h3><button onclick="document.getElementById('addModal').close()" class="w-8 h-8 bg-gray-100 rounded-full">✕</button></div>
<div class="flex gap-2 mb-3 p-1 bg-gray-100 rounded-full"><button id="btnExp" onclick="setType('Expense')" class="flex-1 py-2 rounded-full text-xs font-black bg-black text-white">Expense</button><button id="btnInc" onclick="setType('Income')" class="flex-1 py-2 rounded-full text-xs font-black">Income</button></div>
<form id="addForm" onsubmit="saveTransaction(event)" class="space-y-3">
<input type="date" id="dateInput" required class="w-full border-2 rounded-full px-4 py-3 text-sm">
<input type="number" id="amountInput" step="0.01" placeholder="Amount ₹" required class="w-full border-2 rounded-full px-4 py-3 text-sm">
<select id="catSelect" class="w-full border-2 rounded-full px-4 py-3 text-sm bg-white"></select>
<input type="text" id="detailsInput" placeholder="Details (optional)" class="w-full border-2 rounded-xl px-4 py-3 text-sm">
<input type="hidden" id="transType" value="Expense">
<button type="submit" class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 text-white py-3 rounded-full text-sm font-black shadow-lg">Save</button>
</form>
</div>
</dialog>

<script>
// === SUPABASE - OPTIONAL, LOCAL ALWAYS WORKS ===
let supabaseClient=null;
try{
  if(window.supabase){
    supabaseClient = window.supabase.createClient('https://hbnpsscgibzzgmdjmfux.supabase.co', 'sb_publishable_Nqeu8b4_kljTrCAsNQRWgw_fehxexxd');
    console.log('Supabase ready');
  }
}catch(e){ console.log('Supabase not ready, using local', e); }

// DATA
let user=null;
let transactions=[];
try{ transactions=JSON.parse(localStorage.getItem('expensecloud_data')||'[]'); }catch(e){ transactions=[]; }

const CATS=["Food","Transport","Shopping","Bills","Rent","Grocery","Health","Entertainment","Education","Fuel","Other","Salary","Freelance","Investment","Gift","Bonus","Travel","EMI","Subscription","Medical","Clothes","Electronics","Home","Family","Business","Loan","Insurance","Tax","Donation","Kids","Pets","Hobby","Sports","Beauty","Repair","Internet","Mobile","Party","Wedding"];
const CAT_ICONS={"Food":"🍔","Transport":"🚗","Shopping":"🛍️","Bills":"🧾","Rent":"🏠","Grocery":"🛒","Health":"🏥","Entertainment":"🎬","Education":"📚","Fuel":"⛽","Other":"📦","Salary":"💼","Freelance":"💻","Investment":"📈","Gift":"🎁","Bonus":"🎉","Travel":"✈️","EMI":"🏦","Subscription":"🔁","Medical":"💊","Clothes":"👕","Electronics":"📱","Home":"🏡","Family":"👨‍👩‍👧‍👦","Business":"🏢","Loan":"💳","Insurance":"🛡️","Tax":"📊","Donation":"❤️","Kids":"👶","Pets":"🐾","Hobby":"🎨","Sports":"⚽","Beauty":"💅","Repair":"🔧","Internet":"🌐","Mobile":"📱","Party":"🎉","Wedding":"💒"};
function icon(c){ return CAT_ICONS[c]||'📦'; }

// === MODALS - GUARANTEED WORKING ===
function openAuthModal(tab){
  switchTab(tab||'login');
  document.getElementById('authModal').showModal();
}
function openAddModal(){
  document.getElementById('dateInput').valueAsDate=new Date();
  document.getElementById('addModal').showModal();
}
function switchTab(t){
  document.getElementById('loginDiv').classList.toggle('hidden', t!=='login');
  document.getElementById('signupDiv').classList.toggle('hidden', t!=='signup');
  document.getElementById('forgotDiv').classList.toggle('hidden', t!=='forgot');
  document.getElementById('tabLogin').className = t==='login' ? 'flex-1 py-2 rounded-full text-xs font-black bg-black text-white' : 'flex-1 py-2 rounded-full text-xs font-black';
  document.getElementById('tabSignup').className = t==='signup' ? 'flex-1 py-2 rounded-full text-xs font-black bg-black text-white' : 'flex-1 py-2 rounded-full text-xs font-black';
  document.getElementById('tabForgot').className = t==='forgot' ? 'flex-1 py-2 rounded-full text-xs font-black bg-black text-white' : 'flex-1 py-2 rounded-full text-xs font-black';
}
function setType(type){
  document.getElementById('transType').value=type;
  document.getElementById('btnExp').className = type==='Expense' ? 'flex-1 py-2 rounded-full text-xs font-black bg-black text-white' : 'flex-1 py-2 rounded-full text-xs font-black';
  document.getElementById('btnInc').className = type==='Income' ? 'flex-1 py-2 rounded-full text-xs font-black bg-black text-white' : 'flex-1 py-2 rounded-full text-xs font-black';
}

// === AUTH - LOCAL + SUPABASE ===
function saveUsers(users){ localStorage.setItem('expensecloud_users', JSON.stringify(users)); }
function getUsers(){ try{ return JSON.parse(localStorage.getItem('expensecloud_users')||'[]'); }catch(e){ return []; } }

async function handleLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPassword').value;
  const msg=document.getElementById('authMsg');
  if(!email||!pass){ msg.textContent='❌ Fill email & password'; return; }
  msg.textContent='⏳ Logging in...';
  
  // Try Supabase first
  if(supabaseClient){
    try{
      const {data, error}=await supabaseClient.auth.signInWithPassword({email,password:pass});
      if(!error && data.user){
        user=data.user;
        msg.textContent='✅ Logged in via Supabase!';
        updateUI();
        setTimeout(()=>{ document.getElementById('authModal').close(); }, 500);
        loadCloudData();
        return;
      } else {
        console.log('Supabase login failed', error);
      }
    }catch(e){ console.log('Supabase error', e); }
  }
  
  // Local fallback - ALWAYS WORKS
  const users=getUsers();
  const found=users.find(u=>u.email===email && u.pass===pass);
  if(found){
    user={email:email, id:'local_'+email};
    localStorage.setItem('expensecloud_current_user', JSON.stringify(user));
    msg.textContent='✅ Logged in (Local)!';
    updateUI();
    setTimeout(()=>{ document.getElementById('authModal').close(); }, 500);
  } else {
    msg.textContent='❌ Wrong email/password or not signed up. Try Sign Up.';
  }
}

async function handleSignup(){
  const email=document.getElementById('signupEmail').value.trim();
  const pass=document.getElementById('signupPassword').value;
  const confirm=document.getElementById('signupConfirm').value;
  const msg=document.getElementById('authMsg');
  if(pass!==confirm){ msg.textContent='❌ Passwords mismatch'; return; }
  if(pass.length<6){ msg.textContent='❌ Min 6 chars'; return; }
  msg.textContent='⏳ Creating...';
  
  if(supabaseClient){
    try{
      const {data, error}=await supabaseClient.auth.signUp({email,password:pass});
      if(!error){
        msg.textContent='✅ Created! Now Login. Check email if confirmation needed.';
        switchTab('login');
        return;
      } else {
        msg.textContent='❌ '+error.message+' - Trying local...';
      }
    }catch(e){ console.log(e); }
  }
  
  // Local signup - ALWAYS WORKS
  let users=getUsers();
  if(users.find(u=>u.email===email)){ msg.textContent='❌ Email already exists, Login'; return; }
  users.push({email, pass});
  saveUsers(users);
  msg.textContent='✅ Account created (Local)! Now Login.';
  switchTab('login');
}

async function handleForgot(){
  const email=document.getElementById('forgotEmail').value.trim();
  const msg=document.getElementById('authMsg');
  msg.textContent='⏳ Sending...';
  if(supabaseClient){
    try{
      const {error}=await supabaseClient.auth.resetPasswordForEmail(email);
      if(!error){ msg.textContent='✅ Reset link sent to '+email+' (check spam)'; return; }
      else { msg.textContent='❌ '+error.message; return; }
    }catch(e){ msg.textContent='❌ '+e.message; }
  } else {
    msg.textContent='❌ Supabase not configured. Use Sign Up with new password for local.';
  }
}

async function handleGoogle(){
  const msg=document.getElementById('authMsg');
  if(!supabaseClient){ msg.textContent='❌ Gmail needs Supabase. Enable Google in Supabase Dashboard.'; return; }
  msg.textContent='⏳ Redirecting...';
  try{
    const {error}=await supabaseClient.auth.signInWithOAuth({provider:'google', options:{redirectTo:location.origin}});
    if(error) msg.textContent='❌ '+error.message;
  }catch(e){ msg.textContent='❌ '+e.message; }
}

async function handleLogout(){
  if(supabaseClient){ try{ await supabaseClient.auth.signOut(); }catch(e){} }
  user=null;
  localStorage.removeItem('expensecloud_current_user');
  updateUI();
  transactions=JSON.parse(localStorage.getItem('expensecloud_data')||'[]');
  render();
}

function updateUI(){
  const ue=document.getElementById('userEmail');
  const lb=document.getElementById('loginBtn');
  const lo=document.getElementById('logoutBtn');
  if(user){
    if(ue){ ue.textContent=user.email; ue.classList.remove('hidden'); }
    if(lb) lb.classList.add('hidden');
    if(lo) lo.classList.remove('hidden');
  } else {
    if(ue) ue.classList.add('hidden');
    if(lb) lb.classList.remove('hidden');
    if(lo) lo.classList.add('hidden');
  }
}

async function loadCloudData(){
  if(!supabaseClient || !user) return;
  try{
    const {data, error}=await supabaseClient.from('expenses').select('*').order('date',{ascending:false});
    if(!error && data){ transactions=data; render(); }
  }catch(e){ console.log('Cloud load error', e); }
}

// === TRANSACTIONS ===
function saveTransaction(e){
  e.preventDefault();
  const item={
    id: Date.now().toString(),
    date: document.getElementById('dateInput').value,
    amount: parseFloat(document.getElementById('amountInput').value),
    category: document.getElementById('catSelect').value,
    details: document.getElementById('detailsInput').value,
    transaction_type: document.getElementById('transType').value,
    type: 'UPI'
  };
  transactions.unshift(item);
  localStorage.setItem('expensecloud_data', JSON.stringify(transactions));
  
  // Try cloud save if logged in via Supabase
  if(supabaseClient && user && !user.id.startsWith('local_')){
    supabaseClient.from('expenses').insert({...item, user_id:user.id}).then(r=>{ if(r.error) console.log('Cloud save error', r.error); });
  }
  
  render();
  document.getElementById('addModal').close();
  e.target.reset();
}

function delTransaction(id){
  if(!confirm('Delete?')) return;
  transactions=transactions.filter(t=>t.id!=id);
  localStorage.setItem('expensecloud_data', JSON.stringify(transactions));
  if(supabaseClient && user && !user.id.startsWith('local_')){
    supabaseClient.from('expenses').delete().eq('id',id).then(()=>{});
  }
  render();
}

function exportCSV(){
  if(!transactions.length) return alert('No data');
  let csv="Date,Type,Amount,Category,Details\n"+transactions.map(t=>`${t.date},${t.transaction_type},${t.amount},${t.category},${t.details}`).join("\n");
  let blob=new Blob([csv],{type:'text/csv'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='expenses.csv';
  a.click();
}

// === CHARTS - BIG BARS ===
let donutChart=null, pieChart=null, barChart=null, lineChart=null;
function render(){
  let totalIncome=0, totalExpense=0;
  transactions.forEach(t=>{ if(t.transaction_type==='Income') totalIncome+= +t.amount; else totalExpense+= +t.amount; });
  document.getElementById('walletBalance').textContent='₹'+(totalIncome-totalExpense).toLocaleString('en-IN');
  document.getElementById('incomeTotal').textContent='Income ₹'+totalIncome.toLocaleString('en-IN');
  document.getElementById('expenseTotal').textContent='Expense ₹'+totalExpense.toLocaleString('en-IN');
  document.getElementById('totalSpent').textContent='₹'+totalExpense.toLocaleString('en-IN');
  document.getElementById('totalEntries').textContent=transactions.length;
  document.getElementById('tableCount').textContent=transactions.length;

  // Category donut - BIG
  const byCat={};
  transactions.filter(t=>t.transaction_type==='Expense').forEach(t=>{ byCat[t.category]=(byCat[t.category]||0)+ +t.amount; });
  let catLabels=Object.keys(byCat);
  let catVals=Object.values(byCat);
  if(catLabels.length===0){ catLabels=['Food','Transport','Shopping','Bills']; catVals=[450,300,600,200]; }
  
  const donutCtx=document.getElementById('donutChart');
  if(donutCtx && window.Chart){
    if(donutChart) donutChart.destroy();
    donutChart=new Chart(donutCtx,{
      type:'doughnut',
      data:{labels:catLabels.map(c=>icon(c)+' '+c), datasets:[{data:catVals, backgroundColor:['#3b82f6','#f59e0b','#10b981','#8b5cf6','#ec4899','#06b6d4']}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}}
    });
  }
  document.getElementById('donutList').innerHTML=Object.entries(byCat).map(([k,v])=>`<div class="flex justify-between bg-gray-50 px-3 py-1 rounded-full"><span>${icon(k)} ${k}</span><span class="font-bold">₹${v}</span></div>`).join('');

  // Monthly bar - BIG BARS
  const byMonth={};
  transactions.filter(t=>t.transaction_type==='Expense').forEach(t=>{ if(!t.date) return; const m=t.date.slice(0,7); byMonth[m]=(byMonth[m]||0)+ +t.amount; });
  let mKeys=Object.keys(byMonth).sort().slice(-6);
  let mVals=mKeys.map(k=>byMonth[k]);
  if(mKeys.length===0){ mKeys=['2025-09','2025-10','2025-11','2025-12','2026-01','2026-02']; mVals=[1200,1900,1500,2200,1800,2500]; }
  const barCtx=document.getElementById('barChart');
  if(barCtx && window.Chart){
    if(barChart) barChart.destroy();
    barChart=new Chart(barCtx,{
      type:'bar',
      data:{labels:mKeys.map(k=>{ const p=k.split('-'); const mons=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return mons[parseInt(p[1])-1]+"'"+p[0].slice(-2); }), datasets:[{data:mVals, backgroundColor:['#3b82f6','#f59e0b','#10b981','#8b5cf6','#ec4899','#06b6d4'], borderRadius:10, barThickness:32}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}, x:{ticks:{font:{size:12, weight:'bold'}, maxRotation:90, minRotation:90}}}}
    });
  }

  // Pie
  const byType={};
  transactions.forEach(t=>{ byType[t.type||'UPI']=(byType[t.type||'UPI']||0)+ +t.amount; });
  let typeLabels=Object.keys(byType);
  let typeVals=Object.values(byType);
  if(typeLabels.length===0){ typeLabels=['UPI','Cash','Card']; typeVals=[800,400,350]; }
  const pieCtx=document.getElementById('pieChart');
  if(pieCtx && window.Chart){
    if(pieChart) pieChart.destroy();
    pieChart=new Chart(pieCtx,{type:'pie', data:{labels:typeLabels, datasets:[{data:typeVals, backgroundColor:['#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899']}]}, options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}}});
  }

  // Line
  const daily={};
  const today=new Date();
  for(let i=13;i>=0;i--){ const d=new Date(today); d.setDate(today.getDate()-i); daily[d.toISOString().slice(0,10)]=0; }
  if(transactions.length===0){
    const sample=[120,250,180,300,220,400,350,280,190,310,260,420,380,200];
    Object.keys(daily).forEach((k,i)=>daily[k]=sample[i]);
  } else {
    transactions.filter(t=>t.transaction_type==='Expense' && daily.hasOwnProperty(t.date)).forEach(t=>daily[t.date]+= +t.amount);
  }
  const lineCtx=document.getElementById('lineChart');
  if(lineCtx && window.Chart){
    if(lineChart) lineChart.destroy();
    lineChart=new Chart(lineCtx,{type:'line', data:{labels:Object.keys(daily).map(k=>{ const d=new Date(k); return String(d.getDate()).padStart(2,'0')+'-'+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]; }), datasets:[{data:Object.values(daily), borderColor:'#8b5cf6', backgroundColor:'rgba(139,92,246,0.15)', tension:0.4, fill:true, borderWidth:3, pointBackgroundColor:'#8b5cf6'}]}, options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}}});
  }

  // Table
  const tbody=document.getElementById('tbody');
  tbody.innerHTML=transactions.map(t=>`<tr class="border-t"><td class="p-3 text-[11px]">${t.date}</td><td class="p-3"><span class="border px-2 py-1 rounded-full text-[10px] font-bold">${t.transaction_type}</span></td><td class="p-3 font-black">₹${t.amount}</td><td class="p-3">${icon(t.category)} ${t.category}</td><td class="p-3 truncate max-w-[100px] text-[11px]">${t.details||'-'}</td><td class="p-3"><button onclick="delTransaction('${t.id}')" class="text-red-500 border px-2 py-1 rounded-full text-[10px]">Delete</button></td></tr>`).join('') || '<tr><td colspan=6 class="p-10 text-center text-gray-400">No data<br><button onclick="openAddModal()" class="mt-2 bg-gradient-to-r from-violet-600 to-indigo-600 text-white px-4 py-2 rounded-full text-xs">+ Add First</button></td></tr>';
}

// INIT
function init(){
  const catSel=document.getElementById('catSelect');
  catSel.innerHTML=CATS.map(c=>`<option>${icon(c)} ${c}</option>`).join('');
  // Check local user
  try{
    const lu=JSON.parse(localStorage.getItem('expensecloud_current_user')||'null');
    if(lu){ user=lu; }
  }catch(e){}
  updateUI();
  render();
  // Try supabase user
  if(supabaseClient){
    supabaseClient.auth.getUser().then(({data})=>{ if(data.user){ user=data.user; updateUI(); loadCloudData(); } }).catch(()=>{});
  }
}
init();

</script>
