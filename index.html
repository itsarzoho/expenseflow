create table public.transactions (
  id uuid primary key default gen_random_uuid(),
  user_id uuid references auth.users(id) on delete cascade,
  date date not null,
  amount numeric not null check (amount > 0),
  transaction_type text not null check (transaction_type in ('income','expense','investment')),
  category text not null,
  details text,
  remarks text,
  created_at timestamptz default now()
);
alter table public.transactions enable row level security;
create policy "Users can view own transactions" on public.transactions for select using (auth.uid() = user_id);
create policy "Users can insert own transactions" on public.transactions for insert with check (auth.uid() = user_id);
create policy "Users can update own transactions" on public.transactions for update using (auth.uid() = user_id);
create policy "Users can delete own transactions" on public.transactions for delete using (auth.uid() = user_id);
create index idx_tx_user_date on public.transactions(user_id, date desc);
create index idx_tx_type on public.transactions(user_id, transaction_type);
create index idx_tx_category on public.transactions(user_id, category);

-- NEW: Investments table for Gold, Crypto, SIP, Stocks, FD, RD, Property
create table public.investments (
  id uuid primary key default gen_random_uuid(),
  user_id uuid references auth.users(id) on delete cascade,
  name text not null,
  investment_type text not null check (investment_type in ('Gold','Crypto','Stocks','SIP','FD','RD','Property','Other')),
  amount_invested numeric not null check (amount_invested > 0),
  current_value numeric not null default 0,
  quantity numeric,
  unit text,
  purchase_date date not null,
  maturity_date date,
  expected_return numeric,
  monthly_amount numeric,
  sip_count int default 1,
  next_due_date date,
  notes text,
  created_at timestamptz default now()
);
alter table public.investments enable row level security;
create policy "Users view own investments" on public.investments for select using (auth.uid() = user_id);
create policy "Users insert own investments" on public.investments for insert with check (auth.uid() = user_id);
create policy "Users update own investments" on public.investments for update using (auth.uid() = user_id);
create policy "Users delete own investments" on public.investments for delete using (auth.uid() = user_id);
create index idx_inv_user_type on public.investments(user_id, investment_type);
create index idx_inv_user_date on public.investments(user_id, purchase_date desc);
create index idx_inv_next_due on public.investments(user_id, next_due_date);

-- Views
create or replace view public.portfolio_summary as
select user_id,
  sum(amount_invested) as total_invested,
  sum(current_value) as total_current,
  sum(current_value - amount_invested) as total_pl
from public.investments group by user_id;
